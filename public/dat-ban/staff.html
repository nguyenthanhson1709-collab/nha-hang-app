<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Vietbowl">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vietbowl Potsdamer Platz · Reservierung</title>
<meta name="description" content="Tisch reservieren im Vietbowl Potsdamer Platz, Marlene-Dietrich-Platz 1, 10785 Berlin.">
<meta name="theme-color" content="#F68712">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: app shell with a top bar; guest side is a single centered booking card, staff side is a tabbed workspace. */
:root{
  --bg:#FAF6F2; --surface:#FFFFFF; --sunk:#F3ECE5; --fg:#211A15; --muted:#6F635A; --line:#E7DCD2;
  --accent:#B65C0C; --accent-hover:#9E4F09; --accent-ink:#FFFFFF; --accent-soft:#FCE8D4;
  --ok:#2E7A4C; --ok-soft:#DDF0E3; --warn:#9A6A12; --warn-soft:#FBEFD2; --bad:#B0413A; --bad-soft:#F8DEDB;
  --info:#3A68A3; --info-soft:#DEE8F6; --seat:#6A4CAB; --seat-soft:#E9E2F6; --off:#8A817A; --off-soft:#ECE8E4;
  --yel:#7A5C00; --yel-soft:#FFF1B8; --yel-line:#D9A400;
  --font-display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110E; --surface:#1F1915; --sunk:#2A221D; --fg:#F4ECE5; --muted:#AA9D92; --line:#3A3029;
  --accent:#F68712; --accent-hover:#FF9A33; --accent-ink:#1C0F05; --accent-soft:#3D2610;
  --ok:#6FCB92; --ok-soft:#1C3527; --warn:#E5B85A; --warn-soft:#3A2F15; --bad:#EC877F; --bad-soft:#3E1F1C;
  --info:#8DB3E8; --info-soft:#1D2A3D; --seat:#B79CEB; --seat-soft:#2C2342; --off:#8F857D; --off-soft:#2A2522;
  --yel:#F5CF4F; --yel-soft:#3A3110; --yel-line:#E0B43A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#1F1915; --sunk:#2A221D; --fg:#F4ECE5; --muted:#AA9D92; --line:#3A3029;
  --accent:#F68712; --accent-hover:#FF9A33; --accent-ink:#1C0F05; --accent-soft:#3D2610;
  --ok:#6FCB92; --ok-soft:#1C3527; --warn:#E5B85A; --warn-soft:#3A2F15; --bad:#EC877F; --bad-soft:#3E1F1C;
  --info:#8DB3E8; --info-soft:#1D2A3D; --seat:#B79CEB; --seat-soft:#2C2342; --off:#8F857D; --off-soft:#2A2522;
  --yel:#F5CF4F; --yel-soft:#3A3110; --yel-line:#E0B43A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.demo-pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:999px;font-weight:600}
main{padding-block:24px 56px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=number],input[type=time],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:15px;color:var(--fg);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.muted{color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* Guest */
.guest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
.guest>*{min-width:0}
.hero{padding:8px 0}
.hero .logo-big{display:block}
.hero h1{font-size:34px;margin-top:14px}
.hero p{max-width:42ch}
.facts{display:grid;gap:10px;margin-top:20px;font-size:14px}
.facts div{display:flex;gap:10px}
.facts span:first-child{color:var(--muted);min-width:92px}
.book{padding:22px}
.book h2{font-size:22px;margin-bottom:4px}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.section-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.party{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:42px;height:42px;font-size:20px}
.stepper output{min-width:56px;text-align:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;text-align:center;min-width:62px}
.day small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.day b{font-size:17px;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-variant-numeric:tabular-nums;font-weight:500}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.note-box{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--fg)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.summary{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:500;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.done-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);font-size:26px;margin-bottom:12px}
.done-icon.pending{background:var(--warn-soft);color:var(--warn)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.12em;font-weight:600}
.email{border:1px dashed var(--line);border-radius:12px;margin-top:18px;overflow:hidden}
.email header{background:var(--sunk);padding:10px 14px;font-size:13px;color:var(--muted)}
.email .body{padding:16px;font-size:14px}
.email .body table{border-collapse:collapse;margin:10px 0}
.email .body td{padding:3px 14px 3px 0}
.email .body td:first-child{color:var(--muted)}

/* Staff */
.login{max-width:420px;margin:24px auto;padding:26px;display:grid;gap:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.staffbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.staffbar .grow{flex:1}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datenav input{width:auto}
.datenav h2{font-size:20px;margin:0 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) 84px 140px 64px 170px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.is-new{box-shadow:inset 3px 0 0 var(--accent)}
.row .time{font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pax{font-variant-numeric:tabular-nums}
.row .tbl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-pending{background:var(--seat-soft);color:var(--seat)}
.st-confirmed{background:var(--yel-soft);color:var(--yel)}
.st-seated{background:var(--ok-soft);color:var(--ok)}
.st-done{background:var(--off-soft);color:var(--muted)}
.st-cancelled,.st-noshow{background:var(--off-soft);color:var(--off)}
.st-noshow{background:var(--bad-soft);color:var(--bad)}
.st-select{width:100%;font-size:13px;font-weight:600;padding:6px 28px 6px 10px;border-radius:999px;border:1px solid transparent;cursor:pointer}
.st-select.st-pending{border-color:var(--seat)}
.st-select.st-confirmed{border-color:var(--yel-line)}
.st-select.st-seated{border-color:var(--ok)}
.st-select.st-done{border-color:var(--ok)}
.st-select.st-cancelled{border-color:var(--line)}.st-select.st-noshow{border-color:var(--bad)}
.st-fixed{padding:6px 12px;font-size:13px}
.st-select option{background:var(--surface);color:var(--fg);font-weight:500}
.row.head{cursor:default;background:var(--sunk);padding-block:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row.head:hover{background:var(--sunk)}
.row.head span{white-space:nowrap}
.row .tbl{color:var(--fg)}
.mob{display:none}
@media (max-width:560px){.row.head{display:none}.mob{display:inline}.row.head+.row{border-top:0}}
.field-err{color:var(--bad);font-size:13px;font-weight:500}
.invalid input[type=text],.invalid input[type=tel],.invalid input[type=email]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.invalid .check input{outline:2px solid var(--bad);outline-offset:1px}
.srcic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--info);background:var(--info-soft);border:0;padding:0}
.srcic.online{cursor:pointer}.srcic.online:hover{outline:2px solid var(--info)}
.srcic.staff{color:var(--accent);background:var(--accent-soft);cursor:pointer}
.srcic.staff:hover{outline:2px solid var(--accent)}
.pin-login{max-width:360px;justify-items:stretch}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-top:8px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;font-family:var(--font-display)}
.key:hover{background:var(--sunk)}
.key:active{background:var(--accent-soft)}
.key.soft{font-size:15px;font-weight:500;color:var(--muted);background:var(--sunk)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.newtag{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px;letter-spacing:.04em}

.floorbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.floor-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.plan-wrap{padding:8px;min-width:0;max-height:calc(100vh - 220px);overflow:auto}
.plan-wrap.fit{max-height:none;overflow:hidden;display:flex;justify-content:center}
.plan-wrap.fit .plan{height:var(--ph,70vh);width:auto;max-width:100%;min-width:0}
.plan-wrap.fit .plan .num{font-size:25px;font-weight:800}
.plan{display:block;width:100%;height:auto;min-width:560px;touch-action:manipulation}
.plan .wall{fill:none;stroke:var(--muted);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.plan .wall.thin{stroke-width:4}
.plan .bar{fill:var(--sunk);stroke:var(--muted);stroke-width:2;opacity:.8}
.plan .stairs{fill:none;stroke:var(--muted);stroke-width:4;opacity:.4}
.plan .plant{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2;opacity:.6}
.plan .zone{font:600 22px var(--font-display);fill:var(--muted);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.plan .tb{cursor:pointer;outline:none}
.plan .chair{fill:var(--surface);stroke:var(--muted);stroke-width:1.5;opacity:.7}
.plan .top{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.plan .num{font:700 17px var(--font-body);fill:var(--fg);text-anchor:middle;font-variant-numeric:tabular-nums;pointer-events:none}
.plan .pax{font:500 10px var(--font-body);fill:var(--muted);text-anchor:middle;pointer-events:none}
.plan .tb.free .top{fill:var(--surface);stroke:var(--muted)}
.plan .tb.reserved .top{fill:var(--yel-soft);stroke:var(--yel-line)}
.plan .tb.pending .top{fill:var(--seat-soft);stroke:var(--seat)}
.plan .tb.seated .top{fill:var(--ok-soft);stroke:var(--ok)}
.plan .tb.busy{opacity:.35}
.plan .tb.edit .top{fill:var(--surface);stroke-dasharray:5 3}
.plan.edit .tb{cursor:grab}
.plan .tb.sel .top,.plan .tb.picked .top{stroke:var(--accent);stroke-width:4}
.plan .tb.picked .top{fill:var(--accent-soft)}
.plan .tb:hover .top{stroke-width:3.5}
.plan .tb:focus-visible .top{stroke:var(--accent);stroke-width:4}
.plan .tick circle{fill:var(--accent)}
.plan .tick path{fill:none;stroke:var(--accent-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.plan-mini{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.plan-mini .plan{min-width:520px}
.area-line{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.areas{display:grid;gap:16px;min-width:0}
.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.area header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.area header input{max-width:220px;font-weight:600}
.area h3{font-size:15px}
.canvas-scroll{overflow-x:auto}
.canvas{position:relative;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;border-radius:8px}
.tbl-el{position:absolute;display:grid;place-items:center;border:2px solid var(--line);background:var(--sunk);font-weight:600;font-size:14px;user-select:none;touch-action:none;line-height:1.05;text-align:center}
.tbl-el small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.tbl-el.sq{width:58px;height:58px;border-radius:8px}
.tbl-el.rect{width:96px;height:58px;border-radius:8px}
.tbl-el.round{width:60px;height:60px;border-radius:50%}
.tbl-el.free{background:var(--surface);border-color:var(--muted)}
.tbl-el.reserved{background:var(--yel-soft);border-color:var(--yel-line)}
.tbl-el.pending{background:var(--seat-soft);border-color:var(--seat)}
.tbl-el.seated{background:var(--ok-soft);border-color:var(--ok)}
.tbl-el.sel{outline:3px solid var(--accent);outline-offset:2px}
.editing .tbl-el{cursor:grab;background:var(--surface);border-style:dashed}
.side{position:sticky;top:80px;padding:16px;display:grid;gap:12px}
.side h3{font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}

.settings{display:grid;gap:16px;max-width:760px}
.set{padding:18px;display:grid;gap:14px}
.set h3{font-size:17px}
.toggle-row{display:flex;justify-content:space-between;gap:16px;align-items:center}
.switch{position:relative;width:46px;height:26px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.team-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.team-row:first-of-type{border-top:0}

.overlay{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.modal h2{font-size:21px}
.tblpick{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow:auto;padding:2px}
.tblpick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px;font-size:13px;font-variant-numeric:tabular-nums}
.tblpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tblpick button.busy{opacity:.4}

/* ---------- booking logic ---------- */
const ACTIVE=["pending","confirmed","seated"];
function isClosed(dateS){
  const d=parseD(dateS);const key=pad(d.getDate())+"."+pad(d.getMonth()+1);
  return S.settings.closed.split(",").map(x=>x.trim()).filter(Boolean).some(x=>{const [dd,mm]=x.split(".");return pad(+dd)+"."+pad(+mm)===key});
}
function busyTables(dateS,timeS,excludeId){
  const m=toMin(timeS),dur=S.settings.duration;const set=new Set();
  S.bookings.forEach(b=>{if(b.id===excludeId||b.date!==dateS||!ACTIVE.includes(b.status))return;
    if(Math.abs(toMin(b.time)-m)<dur)b.tables.forEach(x=>set.add(x))});
  return set;
}
function assign(party,dateS,timeS,excludeId){
  const busy=busyTables(dateS,timeS,excludeId);
  const free=S.tables.filter(x=>!busy.has(x.id));
  const single=free.filter(x=>x.seats>=party).sort((a,b)=>a.seats-b.seats||(+a.n)-(+b.n))[0];
  if(single)return [single.id];
  let best=null;
  S.areas.forEach(a=>{
    const list=free.filter(x=>x.area===a.id).sort((p,q)=>(+p.n)-(+q.n));
    // consecutive tables by number inside an area, fewest tables first
    for(let i=0;i<list.length;i++){let sum=0;const pick=[];
      for(let j=i;j<list.length;j++){sum+=list[j].seats;pick.push(list[j].id);if(sum>=party)break}
      if(sum>=party&&(!best||pick.length<best.length))best=pick.slice();}
  });
  return best;
}
function slotsFor(dateS){
  const st=S.settings,last=toMin(st.close)-st.duration,out=[];
  const wd=parseD(dateS).getDay();let open=toMin(st.open);
  if(wd>=1&&wd<=5&&st.weekdayFrom)open=Math.max(open,toMin(st.weekdayFrom));
  for(let m=open;m<=last;m+=st.interval)out.push(toHM(m));
  return out;
}
function isPast(dateS,timeS){const [y,mo,d]=dateS.split("-").map(Number),m=toMin(timeS);return new Date(y,mo-1,d,Math.floor(m/60),m%60).getTime()<Date.now()+(S.settings.leadHours||0)*3600000}

  if(isPast(dateS,timeS))return false;
  const pc=peakCheck(dateS,timeS,party);if(pc&&!pc.ok)return false;
  return true;
}
/* peak hour limits: counted in guests (pax) per window, windows aligned to the rule start */
const PAX=["pending","confirmed","seated","done"];
const DAY_ORDER=[1,2,3,4,5,6,0];
function rulesAt(dateS,m){
  if(!S.settings.peakEnabled)return [];
  const wd=parseD(dateS).getDay();
  return (S.peakRules||[]).filter(r=>r.active&&r.days.includes(wd)&&m>=toMin(r.from)&&m<toMin(r.to));
}
function windowOf(r,m){const f=toMin(r.from),a=f+Math.floor((m-f)/r.block)*r.block;return [a,Math.min(a+r.block,toMin(r.to))]}
function paxIn(dateS,a,b,excludeId){
  return S.bookings.filter(x=>x.id!==excludeId&&x.date===dateS&&PAX.includes(x.status)&&toMin(x.time)>=a&&toMin(x.time)<b).reduce((n,x)=>n+x.party,0);
}
function peakCheck(dateS,timeS,party,excludeId){
  const m=toMin(timeS);let worst=null;
  rulesAt(dateS,m).forEach(r=>{const [a,b]=windowOf(r,m);const used=paxIn(dateS,a,b,excludeId);
    const info={rule:r,a,b,used,left:r.max-used,ok:party<=r.max-used};
    if(!worst||info.left<worst.left)worst=info});
  return worst;
}
function suggestTimes(dateS,timeS,party){
  const m=toMin(timeS);
  return slotsFor(dateS).filter(x=>x!==timeS&&slotOk(dateS,x,party)).sort((p,q)=>Math.abs(toMin(p)-m)-Math.abs(toMin(q)-m)).slice(0,4).sort();
}
function dayLabel(days){
  const names=t("dayNames");const idx=DAY_ORDER.map(d=>days.includes(d));const runs=[];let i=0;
  while(i<7){if(!idx[i]){i++;continue}let j=i;while(j+1<7&&idx[j+1])j++;
    runs.push(j>i?names[DAY_ORDER[i]]+" – "+names[DAY_ORDER[j]]:names[DAY_ORDER[i]]);i=j+1}
  return runs.join(", ");
}
function tName(ids){
  /* consecutive tables (by the plan's number order) are shown as a range: 41→44 */
  const order=S.tables.map(x=>x.n).sort((p,q)=>(parseFloat(p)-parseFloat(q))||p.localeCompare(q));
  const pos=new Map(order.map((n,i)=>[n,i]));
  const ns=ids.map(id=>{const x=S.tables.find(z=>z.id===id);return x?x.n:"?"}).sort((p,q)=>(pos.get(p)??1e9)-(pos.get(q)??1e9));
  const runs=[];ns.forEach(n=>{const r=runs[runs.length-1];if(r&&pos.has(n)&&pos.get(n)===pos.get(r[r.length-1])+1)r.push(n);else runs.push([n])});
  return runs.map(r=>r.length>=3?r[0]+"→"+r[r.length-1]:r.join(" + ")).join(", ");
}

function renderTop(){
  document.documentElement.lang=ui.lang;
  document.documentElement.dataset.fs=(ui.view==="staff"&&S.settings&&S.settings.fontSize)||"m";
  const GV=ui.view!=="staff";document.documentElement.classList.add("gdark");document.documentElement.classList.toggle("sdark",!GV);document.documentElement.dataset.theme="dark";document.documentElement.dataset.season=gSeason();try{gSeasonFx()}catch(e){}if(!document.querySelector("body>.gbg")){const bgd=document.createElement("div");bgd.className="gbg";bgd.setAttribute("aria-hidden","true");document.body.prepend(bgd)}
  const LL=o=>o[ui.lang]||o.de;
  document.getElementById("topbar").innerHTML=`
  <div class="brand">${gSeason()==="xmas"?`<img class="logo-xmas-top" src="img/logo-top-xmas.webp?v=2" alt="Vietbowl" width="440" height="239">`:logo(34)}<small>Potsdamer Platz</small></div>
  <span class="grow" style="flex:1"></span>
  ${GV?`<nav class="gnavbar"><button class="gnb on" data-act="g-go" data-v="g-book">${GIC.cal}<span>${LL({de:"Tisch reservieren",en:"Book a table",vi:"Đặt bàn"})}</span></button><a class="gnb" href="speisekarte.pdf" target="_blank" rel="noopener">${GIC.fork}<span>${LL({de:"Speisekarte",en:"Menu",vi:"Thực đơn"})}</span></a><a class="gnb" href="https://maps.app.goo.gl/dua1NhLpHr2oGLSz5" target="_blank" rel="noopener">${GIC.pin}<span>Google Maps</span></a></nav>`:""}
  <div class="seg" role="group" aria-label="Language">
    ${["de","en","vi"].map(l=>`<button data-act="lang" data-v="${l}" aria-pressed="${ui.lang===l}">${l.toUpperCase()}</button>`).join("")}
  </div>`;
}

/* ---------- render: guest ---------- */
function renderGuest(){
  const g=ui.g,st=S.settings,L=o=>o[ui.lang]||o.de;
  const row=(ic,k,v)=>`<div class="gf-row"><span class="gf-ic">${GIC[ic]}</span><span class="gf-k">${k}</span><span class="gf-v">${v}</span></div>`;
  const facts=`<div class="gfacts">
      ${row("pin",t("address"),`<a href="https://maps.app.goo.gl/dua1NhLpHr2oGLSz5" target="_blank" rel="noopener">Marlene-Dietrich-Platz 1<br>10785 Berlin</a>`)}
      ${row("clock",L({de:"Öffnungszeiten",en:"Opening hours",vi:"Giờ mở cửa"}),`${L({de:"Täglich",en:"Daily",vi:"Hằng ngày"})} ${esc(st.open)} – ${esc(st.close)}<br><small>${t("closedL")}: ${t("closedV")}</small>`)}
      ${row("fork",L({de:"Küche",en:"Cuisine",vi:"Ẩm thực"}),L({de:"Vietnamesisch · Sushi · Modern · Authentisch",en:"Vietnamese · Sushi · Modern · Authentic",vi:"Việt Nam · Sushi · Hiện đại · Chuẩn vị"}))}
      ${row("cal",t("onlineL"),esc(t("onlineV",st.weekdayFrom||st.open)))}
    </div>
    <p class="gmanage"><button class="link" data-act="g-manage">${t("manage")}</button></p>`;
  const hero=`<section class="hero ghero" id="g-info"><div class="ghero-panel">
    <div class="logo-big glogo">${gSeason()==="xmas"?`<div class="glogo-x"><img src="img/logo-xmas.jpg" alt="Vietbowl" width="900" height="473"><canvas class="glogo-snow" aria-hidden="true"></canvas></div>`:logo(110)}<div class="glogo-sub">Potsdamer Platz</div></div>${gSeasonBanner()}
    <h1 class="vh">Vietbowl Potsdamer Platz</h1>
    ${facts}</div>
  </section>`;
  let body="";
  if(g.review) body=renderReview();
  else if(g.manage) body=renderManage();
  else if(g.step===1) body=renderStep1();
  else if(g.step===2) body=renderStep2();
  else body=renderDone();
  return `<div class="guest">${hero}<section class="card book gcard" id="g-book">${gLights()}${body}</section><section class="ghero-panel ginfo-m">${facts}</section></div>`;
}

const GMUSIC=["music/jingle-bells.mp3","music/we-wish-you.mp3","music/stille-nacht.mp3"];
let _gMu=null;
function gMusic(s){
  const want=s==="xmas"&&!ui.embed;let b=document.getElementById("g-music");
  if(!want){if(b){b.remove();if(_gMu)_gMu.a.pause()}return}

    b.innerHTML=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>${on?"":`<path d="M3 3l18 18" stroke-width="2.4"/>`}</svg><span class="gm-eq" aria-hidden="true"><i></i><i></i><i></i></span>`};

      a.addEventListener("play",paint);a.addEventListener("pause",paint)}

let _gFx=null;

  if(_gFx){cancelAnimationFrame(_gFx.raf);_gFx.c.remove();_gFx=null}

  const x=c.getContext("2d");let W=0,H=0;const fit=()=>{const r=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0)};fit();addEventListener("resize",fit);

  const LP=Array.from({length:26},()=>({x:Math.random(),y:Math.random(),r:.8+Math.random()*2.2,v:.0015+Math.random()*.003,w:Math.random()*6.28,f:Math.random()<.35,a:Math.random()*6.28}));

      if(!reduce){q.y+=q.v;q.w+=.02;q.a+=.01;q.x+=Math.sin(q.w)*.0008;if(q.y>1.02){q.y=-.03;q.x=Math.random()}}}};

/* Soft render of the guest booking page (step 1): instead of rebuilding the page, swap only the parts
   that changed. The party wheel and the Christmas lights stay in place, so nothing jumps or restarts. */
const gSig=el=>el.outerHTML.replace(/<canvas[^>]*>/g,"<canvas>");
function gCardPatch(center){
  const guest=document.querySelector("#app > .guest"),card=document.getElementById("g-book"),w=document.getElementById("g-pgrid");
  if(!guest||!card||!w||ui.view!=="guest"||ui.g.step!==1||ui.g.manage)return false;
  const tmp=document.createElement("div");tmp.innerHTML=renderGuest();
  const ng=tmp.querySelector(".guest"),nc=tmp.querySelector("#g-book");if(!ng||!nc||!nc.querySelector("#g-pgrid"))return false;
  const og=[...guest.children],ngc=[...ng.children],oc=[...card.children],nn=[...nc.children];
  if(og.length!==ngc.length||oc.length!==nn.length)return false;
  const sec=w.closest(".gsec"),si=oc.indexOf(sec),nsec=nn[si];if(si<0||!nsec||!nsec.classList.contains("gsec"))return false;
  const ok=[...sec.children],nk=[...nsec.children];if(ok.length!==nk.length)return false;
  og.forEach((el,i)=>{if(el!==card&&gSig(el)!==gSig(ngc[i]))el.replaceWith(ngc[i])});
  oc.forEach((el,i)=>{if(el===sec||el.classList.contains("glights")||gSig(el)===gSig(nn[i]))return;el.replaceWith(nn[i])});
  ok.forEach((el,i)=>{if(!el.contains(w)){if(gSig(el)!==gSig(nk[i]))el.replaceWith(nk[i]);return}
    el.querySelectorAll("[data-pw]").forEach(b=>{const nb=nk[i].querySelector(`[data-pw="${b.dataset.pw}"]`);if(nb)b.disabled=nb.disabled});
    const lb=el.querySelector(".gw-lbl"),nlb=nk[i].querySelector(".gw-lbl");if(lb&&nlb&&lb.outerHTML!==nlb.outerHTML)lb.replaceWith(nlb)});
  const nw=nc.querySelector("#g-pgrid");w.querySelectorAll(".gp-n").forEach(b=>{const nb=nw.querySelector(`[data-pn="${b.dataset.pn}"]`);if(!nb)return;b.className=nb.className;b.disabled=nb.disabled;b.title=nb.title;b.setAttribute("aria-checked",nb.getAttribute("aria-checked"))});
  try{gSeasonFx()}catch(e){}
  return true}

/* ---------- embed mode (website widget iframe): only the booking card, height reported to the parent page ---------- */
function gEmbedResize(){
  if(window.parent===window)return;let last=0;
  const send=()=>{const el=document.querySelector(".gcard");const h=Math.ceil((el?el.getBoundingClientRect().height:document.body.scrollHeight)+24);
    if(Math.abs(h-last)>2){last=h;try{window.parent.postMessage({vietbowl:"height",h},"*")}catch(_){}}};
  try{new ResizeObserver(send).observe(document.body)}catch(_){setInterval(send,600)}
  new MutationObserver(()=>requestAnimationFrame(send)).observe(document.body,{childList:true,subtree:true});send();
}

/* ---------- party size scroll wheel (owner 2026-11-19) ----------
   The wheel element is kept across re-renders and a choice is committed only after the finger is
   lifted and the scroll (incl. iOS momentum) has fully stopped, so nothing jumps while swiping. */
let GWK=null,GWT=false;
function gWheelCenter(w,smooth){const on=w.querySelector(".gw-n.on");if(!on)return;const x=on.offsetLeft+on.offsetWidth/2-w.clientWidth/2;
  if(Math.abs(w.scrollLeft-x)<1){gWheelMark(w);return}
  if(smooth){w.dataset.lock="1";clearTimeout(w._l);w._l=setTimeout(()=>{delete w.dataset.lock;gWheelMark(w)},500);const tick=()=>{gWheelMark(w);if(w.dataset.lock)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
  w.scrollTo({left:x,behavior:smooth?"smooth":"auto"});gWheelMark(w)}
function gWheelNear(w){const mid=w.scrollLeft+w.clientWidth/2;let best=null,bd=1e9;w.querySelectorAll(".gw-n").forEach(b=>{const d=Math.abs(b.offsetLeft+b.offsetWidth/2-mid);if(d<bd){bd=d;best=b}});return best}
function gWheelMark(w){const mid=w.scrollLeft+w.clientWidth/2;w.querySelectorAll(".gw-n").forEach(b=>{const d=Math.abs(b.offsetLeft+b.offsetWidth/2-mid)/b.offsetWidth;b.style.setProperty("--d",Math.min(d,3).toFixed(2))})}
function gWheelSync(w){const p=String(ui.g.party);w.querySelectorAll(".gw-n").forEach(b=>{const on=b.dataset.pn===p;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});w.dataset.pos=p}
function gWheelCommit(w){if(!w.isConnected||GWT||w.dataset.lock)return;const b=gWheelNear(w);if(!b)return;
  if(+b.dataset.pn!==ui.g.party)gSetParty(b.dataset.pn);else gWheelCenter(w,true)}
new MutationObserver(()=>{const w=document.getElementById("g-wheel");if(!w)return;
  if(w.dataset.pos!==String(ui.g.party)){gWheelSync(w);requestAnimationFrame(()=>gWheelCenter(w,false))}}).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener("touchstart",(e)=>{if(e.target.closest&&e.target.closest("#g-wheel"))GWT=true},{passive:true,capture:true});
document.addEventListener("touchend",(e)=>{if(!GWT)return;GWT=false;const w=document.getElementById("g-wheel");if(w){clearTimeout(w._t);w._t=setTimeout(()=>gWheelCommit(w),300)}},{passive:true,capture:true});
document.addEventListener("touchcancel",()=>{GWT=false},{passive:true,capture:true});
document.addEventListener("scroll",(e)=>{const w=e.target;if(!w||w.id!=="g-wheel")return;gWheelMark(w);if(w.dataset.lock)return;clearTimeout(w._t);w._t=setTimeout(()=>gWheelCommit(w),300)},true);
document.addEventListener("scrollend",(e)=>{const w=e.target;if(w&&w.id==="g-wheel"&&!w.dataset.lock){clearTimeout(w._t);w._t=setTimeout(()=>gWheelCommit(w),60)}},true);

function sCal(){
  const T=todayS(),L=o=>o[ui.lang]||o.de,cm=ui.sCalM||ui.bookDate.slice(0,7),[y,m]=cm.split("-").map(Number);
  const first=new Date(y,m-1,1),off=(first.getDay()+6)%7,n=new Date(y,m,0).getDate();
  const ttl=first.toLocaleDateString(LOC[ui.lang],{month:"long",year:"numeric"});
  const wd=[0,1,2,3,4,5,6].map(i=>new Date(2024,0,1+i).toLocaleDateString(LOC[ui.lang],{weekday:"short"}).replace(".","").slice(0,2));
  let cells="";for(let i=0;i<off;i++)cells+=`<span></span>`;
  for(let d=1;d<=n;d++){const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const sun=new Date(y,m-1,d).getDay()===0;const pax=S.bookings.filter(b=>b.date===ds&&PAX.includes(b.status)).reduce((n,b)=>n+b.party,0);const lv=pax>80?"r":pax>40?"y":"g";
    cells+=`<button class="gc-d${sun?" sun":""}${ds===T?" today":""}${ds<T?" past":""}${isClosed(ds)?" closed":""}" data-act="s-pick" data-v="${ds}" aria-pressed="${ds===ui.bookDate}">${d}${pax?`<i class="sc-dot sc-${lv}" title="${pax}"></i>`:""}</button>`}

function peakStrip(dateS){

function tableState(tbl,dateS,timeS){
  const m=toMin(timeS),dur=S.settings.duration;let state="free",bk=null;
  S.bookings.forEach(b=>{if(b.date!==dateS||!ACTIVE.includes(b.status)||!b.tables.includes(tbl.id))return;
    const bm=toMin(b.time);
    if(m>=bm-30&&m<bm+dur){const s=b.status==="seated"?"seated":b.status==="pending"?"pending":"reserved";
      if(!bk||s==="seated"){state=s;bk=b}}});
  return {state,bk};
}

function chairsFor(x){
  const n=Math.max(0,x.seats|0),horiz=x.w>=x.h,L=horiz?x.w:x.h,S2=horiz?x.h:x.w;
  let a=Math.ceil(n/2),b=Math.floor(n/2);if(x.flip){const tmp=a;a=b;b=tmp}
  const out=[];const cw=Math.min(16,L/Math.max(a,b,1)-4),ch=10;
  const side=(k,sign)=>{for(let i=0;i<k;i++){const along=-L/2+L*(i+0.5)/k,off=sign*(S2/2+ch/2+3);
    const cx=horiz?along:off,cy=horiz?off:along,w=horiz?cw:ch,h=horiz?ch:cw;
    out.push(`<rect class="chair" x="${(cx-w/2).toFixed(1)}" y="${(cy-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`)}};

/* ---------- push local edits to the server ---------- */
async function syncNow(){
  if(!SNAP||!me())return;
  if(syncing){syncAgain=true;return}
  syncing=true;let failed=null;
  try{for(const op of diffOps(SNAP,S)){const r=await op();if(r&&r.error){failed=r.error;break}}}
  catch(e){failed=e}
  if(failed)toast(errText(failed));
  await reloadAll();syncing=false;render();if(M)renderModal();
  if(syncAgain){syncAgain=false;syncNow()}
}
function PL(o){return o[ui.lang]||o.de}
function errText(e){const c=errCode(e);if(c==="mirror_readonly")return PL({de:"Umstellung läuft: bitte kurz warten.",en:"Switching systems: please wait a moment.",vi:"Đang chuyển hệ thống, vui lòng đợi một chút."});return ({full:t("raceFull"),pin_taken:t("pinErr"),forbidden:t("ownerOnly"),cancelled:t("st").cancelled})[c]||t("saveErr")}
function diffOps(A,B){
  const ops=[],byId=l=>new Map((l||[]).map(x=>[x.id,x])),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  if(isOwner()&&!same(A.settings,B.settings))ops.push(()=>sb.from("nh_bk_settings").update(toSettings(B.settings)).eq("restaurant_id",RID));
  if(isOwner()){
    const sync=(oldL,newL,table,to)=>{const o=byId(oldL),n=byId(newL);
      n.forEach((x,id)=>{if(!o.has(id)||!same(o.get(id),x))ops.push(()=>sb.from(table).upsert({...to(x),restaurant_id:RID}))});
      o.forEach((x,id)=>{if(!n.has(id))ops.push(()=>sb.from(table).delete().eq("restaurant_id",RID).eq("id",id))})};
    sync(A.peakRules,B.peakRules,"nh_bk_peak_rules",toRule);
    sync(A.areas,B.areas,"nh_bk_areas",a=>({id:a.id,name:a.name,sort:B.areas.indexOf(a)}));
    sync(A.tables,B.tables,"nh_bk_tables",toTable);
    const ot=byId(A.team),nt=byId(B.team);
    nt.forEach((m,id)=>{if(!ot.has(id))ops.push(()=>sb.rpc("nh_bk_staff_add",{p_rid:RID,p_name:m.name,p_pin:m.pin,p_id:id}))});
    ot.forEach((m,id)=>{if(!nt.has(id))ops.push(()=>sb.from("nh_bk_staff").update({active:false}).eq("id",id))});
  }
  const on=A.guestNotes||{},nn=B.guestNotes||{};
  Object.keys(nn).forEach(k=>{if(on[k]!==nn[k])ops.push(()=>sb.from("nh_bk_guest_notes").upsert({restaurant_id:RID,guest_key:k,note:nn[k]}))});
  Object.keys(on).forEach(k=>{if(!(k in nn))ops.push(()=>sb.from("nh_bk_guest_notes").delete().eq("restaurant_id",RID).eq("guest_key",k))});
  const ob=byId(A.bookings);
  B.bookings.forEach(b=>{const o=ob.get(b.id);
    const fields=x=>[x.date,x.time,x.party,x.name,x.phone,x.email,x.note,x.tables.slice().sort()];
    const tOnly=o&&same(fields(o).slice(0,7),fields(b).slice(0,7))&&!same(fields(o)[7],fields(b)[7]);
    if(tOnly)ops.push(()=>sb.rpc("nh_bk_set_tables",{p_id:b.id,p_tables:b.tables}));
    else if(!o||!same(fields(o),fields(b)))ops.push(()=>sb.rpc("nh_bk_save_booking",{p_rid:RID,p_id:b.id,p_day:b.date,p_slot:b.time,p_party:b.party,p_name:b.name,
      p_phone:b.phone,p_email:b.email,p_note:b.note,p_source:b.source,p_tables:b.tables,p_override:isOwner()}));
    const was=o?o.status:"confirmed";
    if(!!b.called!==!!(o&&o.called))ops.push(()=>sb.rpc("nh_bk_set_called",{p_id:b.id,p_called:!!b.called}));
    if(b.status!==was&&b.status!=="cancelled")ops.push(()=>sb.rpc("nh_bk_set_status",{p_id:b.id,p_status:b.status}));
  });
  const nb=byId(B.bookings);
  if(isOwner())A.bookings.forEach(o=>{if(!nb.has(o.id))ops.push(()=>sb.rpc("nh_bk_delete_booking",{p_id:o.id}))});
  return ops;
}

document.addEventListener("click",e=>{if(e.target.id==="d-input"&&e.target.showPicker){try{e.target.showPicker()}catch(_){}}});
document.addEventListener("click",e=>{const gp=e.target.closest&&e.target.closest(".gmon-pick");if(gp){const i=gp.querySelector("input");try{i.showPicker()}catch(_){}}});
document.addEventListener("input",e=>{{const nc=e.target.id&&document.querySelector(`.ncount[data-for="${e.target.id}"]`);if(nc)nc.textContent=e.target.value.length+"/200";}
  if((e.target.id==="me-name"||e.target.id==="g-name")&&!e.isComposing){const el=e.target,v=capWords(el.value);if(v!==el.value){const s=el.selectionStart,en=el.selectionEnd;el.value=v;try{el.setSelectionRange(s,en)}catch(_){}}}
  if(e.target.id==="me-party-r"){const n=document.getElementById("me-party");if(n)n.value=e.target.value;rangeBubble(e.target,true)}
  const m=/^g-(name|phone|email|consent)$/.exec(e.target.id||"");if(!m||!ui.g.errs||!ui.g.errs[m[1]])return;
  delete ui.g.errs[m[1]];const box=e.target.closest(".invalid");if(box){box.classList.remove("invalid");const er=box.querySelector(".field-err");if(er)er.remove()}
  e.target.removeAttribute("aria-invalid");
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="g-date-input"&&e.target.value){const v=e.target.value<todayS()?todayS():e.target.value;ui.g.date=v;ui.g.time=null;ui.g.full=null;ui.g.per=null;ui.g.ws=addDays(v,-3)<todayS()?todayS():addDays(v,-3);render();return}
  if(id==="d-input"&&e.target.value){ui.bookDate=e.target.value;ui.floorTime=null;render();return}
  if(id==="book-filter"){ui.filter=e.target.value;render();return}
  if(e.target.dataset.statusId){const b=S.bookings.find(x=>x.id===e.target.dataset.statusId);if(b&&b.status!=="cancelled"&&e.target.value!=="cancelled"){b.status=e.target.value;b.isNew=false;if(b.status==="cancelled")b.tables=[];save();toast(t("st")[b.status])}render();return}
  if(id==="floor-time"){ui.floorTime=e.target.value;render();return}
  if(id==="me-party-r"){const n=document.getElementById("me-party");if(n)n.value=e.target.value}
  if(id==="me-date"||id==="me-time"||id==="me-party"||id==="me-party-r"||id==="me-status"||id==="me-override"){readModal();renderModal();return}
  if(id&&id.startsWith("te-")){const x=S.tables.find(z=>z.id===ui.selTable);if(!x)return;
    if(id==="te-n"){const val=e.target.value.trim();if(val&&!S.tables.some(z=>z.n===val&&z.id!==x.id))x.n=val}
    if(id==="te-seats")x.seats=Math.max(1,parseInt(e.target.value)||1);
    if(id==="te-w")x.w=Math.max(20,parseInt(e.target.value)||x.w);
    if(id==="te-h")x.h=Math.max(20,parseInt(e.target.value)||x.h);
    if(id==="te-rot")x.rot=Math.max(-180,Math.min(180,parseInt(e.target.value)||0));
    if(id==="te-area")x.area=e.target.value;
    save();render();return}
  if(e.target.dataset.ruleToggle&&isOwner()){const r=S.peakRules.find(x=>x.id===e.target.dataset.ruleToggle);if(r){r.active=e.target.checked;save();toast(t("saved"));render()}return}
  if(e.target.dataset.areaName){const a=S.areas.find(z=>z.id===e.target.dataset.areaName);if(a){a.name=e.target.value;save()}return}
  if(id&&id.startsWith("s-")&&isOwner()){const st=S.settings,val=e.target.value;
    if(id==="s-auto")st.autoConfirm=e.target.checked;
    if(id==="s-peak")st.peakEnabled=e.target.checked;
    if(id==="s-duration")st.duration=Math.max(30,parseInt(val)||90);
    if(id==="s-min")st.minOnline=Math.max(1,parseInt(val)||1);
    if(id==="s-max")st.maxOnline=Math.max(st.minOnline,parseInt(val)||20);
    if(id==="s-lead")st.leadHours=Math.max(0,parseInt(val)||0);
    if(id==="s-arrive"){st.autoArrive=Math.max(0,parseInt(val)||0);autoArrive()}
    if(id==="s-interval")st.interval=parseInt(val)||15;
    if(id==="s-open"&&val)st.open=val;
    if(id==="s-close"&&val)st.close=val;
    if(id==="s-closed")st.closed=val;
    if(id==="s-wfrom")st.weekdayFrom=val;
    if(id==="s-email")st.email=val;
    ui.pe=ui.pe;
    if(ui.g.party<st.minOnline)ui.g.party=st.minOnline;if(ui.g.party>st.maxOnline)ui.g.party=st.maxOnline;
    save();toast(t("saved"));render();return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.classList&&e.target.classList.contains("pin-edit")){e.preventDefault();const id=e.target.dataset.id,pin=(document.getElementById("pe-pin").value||"").trim();
    if(!/^[0-9]{4}$/.test(pin)){toast(PL({de:"Bitte 4 Ziffern eingeben.",en:"Please enter 4 digits.",vi:"Vui lòng nhập 4 chữ số."}));return}
    sb.rpc("nh_bk_staff_set_pin",{p_id:id,p_pin:pin}).then(({error})=>{if(error){toast(errCode(error)==="pin_taken"?t("pinErr"):t("saveErr"));return}
      ui.pinEdit=null;render();toast(PL({de:"PIN geändert.",en:"PIN changed.",vi:"Đã đổi PIN."}))});return}
  if(e.target.classList&&e.target.classList.contains("rv-gform")){const u=document.getElementById("rv-gurl").value.trim();
    sb.from("nh_bk_settings").update({google_review_url:u||null}).eq("restaurant_id",RID).then(({error})=>{if(error){toast(t("saveErr"));return}REV.google=u;toast(t("saved"))});return}
  if(e.target.id==="login-form"){ownerLogin(document.getElementById("l-email").value.trim(),document.getElementById("l-pw").value);return}
  if(false){const nw=S.bookings.filter(b=>b.isNew&&ACTIVE.includes(b.status));if(nw.length)toast(t("newOnline",nw.map(b=>b.name).join(", ")));return}
  if(e.target.id==="ownerpin-form"){const pin=document.getElementById("op-pin").value.trim(),er=document.getElementById("op-err");
    if(!/^[0-9]{4}$/.test(pin)){er.hidden=false;return}
    sb.rpc("nh_bk_staff_set_pin",{p_id:ui.user,p_pin:pin}).then(({error})=>{if(error){er.textContent=errText(error);er.hidden=false;return}document.getElementById("op-pin").value="";er.hidden=true;toast(t("saved"))});return}
  if(e.target.id==="member-form"){const name=document.getElementById("mf-name").value.trim(),pin=document.getElementById("mf-pin").value.trim();
    if(!name)return;if(!/^[0-9]{4}$/.test(pin)){document.getElementById("mf-err").hidden=false;return}
    S.team.push({id:uid(),name,role:"staff",pin});save();toast(t("added"));render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&M){M=null;renderModal();return}
  if(ui.view==="staff"&&!me()&&ui.loginMode!=="owner"&&!M){if(/^[0-9]$/.test(e.key)){e.preventDefault();pinPress(e.key);return}if(e.key==="Backspace"){e.preventDefault();pinPress("del");return}}
  const k=(e.key==="Enter"||e.key===" ");if(!k||!e.target.closest)return;
  const g=e.target.closest("[data-table],[data-pick]");if(g){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});

/* ---------- drag tables in edit mode ---------- */
let drag=null,dragMoved=false;
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
document.addEventListener("pointerdown",e=>{
  if(!ui.editPlan)return;const el=e.target.closest("[data-table]");if(!el)return;
  const svg=el.ownerSVGElement;const x=S.tables.find(z=>z.id===el.dataset.table);dragMoved=false;
  const p=svgPt(svg,e);drag={el,svg,x,px:p.x,py:p.y,ox:x.x,oy:x.y};el.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;const p=svgPt(drag.svg,e);const dx=p.x-drag.px,dy=p.y-drag.py;
  if(Math.abs(dx)+Math.abs(dy)>6)dragMoved=true;if(!dragMoved)return;
  drag.x.x=Math.round(drag.ox+dx);drag.x.y=Math.round(drag.oy+dy);
  drag.el.setAttribute("transform",`translate(${drag.x.x} ${drag.x.y}) rotate(${drag.x.rot||0})`);
});
document.addEventListener("pointerup",()=>{
  if(!drag)return;const moved=dragMoved;const id=drag.x.id;drag=null;if(moved)save();
  ui.selTable=id;render();setTimeout(()=>{dragMoved=false},0);
});
start();
})();
</script>
</body>
